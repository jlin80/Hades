# =============================================================================
# HADES — Full stack orchestration (Phase 2: platform infrastructure)
# =============================================================================
# Bring everything up with:   docker compose up -d
# Optional analytics/observability layers live behind profiles:
#   docker compose --profile analytics --profile observability up -d
#
# Everything runs in Docker; nothing is installed on the host. Networks are
# split into three tiers (frontend / backend / database) and all durable state
# lives in named volumes so it survives restarts. The structure maps cleanly to
# Kubernetes later (one Deployment per service, the networks become policies).
# =============================================================================
name: hades

# --- shared building blocks --------------------------------------------------
x-app-base: &app-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  # Hardening: the image already runs as the non-root `hades` user (uid 1000);
  # these drop every Linux capability (a pure-Python service needs none) and
  # forbid privilege escalation via setuid binaries. Defence-in-depth for a
  # service that will run unattended 24/7.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # All durable data is volume-backed and shared where services must cooperate
  # (logs aggregate; the liveness dir is read by the watchdog).
  volumes:
    - hades_logs:/var/log/hades
    - hades_run:/var/run/hades
    - hades_config:/app/config
    - hades_models:/app/models
    - hades_backups:/app/backups
    - hades_datasets:/app/datasets
    - hades_research:/app/research
    - hades_docs:/app/docs
  networks:
    - backend
    - database
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    # Every app service waits for the one-shot `migrate` job to bring the schema
    # to head first, so `docker compose up -d` is a complete, no-manual-steps
    # deployment. `migrate` is standalone (not this anchor) to avoid a cycle.
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Health-check budget for the Python services.
#
# Each probe runs `python -m hades.ops.healthcheck`, which starts an interpreter
# and imports the application package — pydantic, sqlalchemy, fastapi and several
# hundred modules. That is inherently slow, and on a small host it is *much*
# slower than it looks: on a 2-vCPU LXC a bare `python -c "print(1)"` measured
# 4.4s, and the full probe 77s under build load. With the previous 10s timeout
# every service sat permanently `unhealthy` with a failing streak in the
# thousands while the processes themselves were fine — a false alarm that hides
# real failures and can drive the watchdog into pointless recovery.
#
# The budget below is sized for the slow case rather than the ideal one. The
# interval is deliberately long too: each probe costs a whole interpreter start,
# so probing often is itself a load problem on a small box.
x-healthcheck-defaults: &healthcheck-defaults
  interval: 60s
  timeout: 45s
  retries: 3
  start_period: 120s

services:
  # ---------------------------------------------------------------------------
  # MIGRATE — one-shot schema migration to `head`, run before any app service.
  # Standalone (does not use the app-base anchor) so app-base can depend on it
  # without a dependency cycle. Idempotent: re-running upgrades to head or no-ops.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # DATA STORES (database tier only — never published to the host in prod)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hades}
      POSTGRES_USER: ${POSTGRES_USER:-hades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hades} -d ${POSTGRES_DB:-hades}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hades_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-hades}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me_in_env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - database

  # ---------------------------------------------------------------------------
  # API — REST + WebSocket (spans frontend/backend/database tiers)
  # ---------------------------------------------------------------------------
  api:
    <<: *app-base
    command: ["hades-api"]
    networks:
      - frontend
      - backend
      - database
    ports:
      # Bound to loopback by default. The API has POST endpoints that change the
      # trading mode, reset the Kill Switch and trip the Circuit Breaker, and
      # authentication is off by default — published on 0.0.0.0 those are
      # reachable by anything that can route to this host. Set API_BIND to a LAN
      # address (or 0.0.0.0) only once you have decided who should reach it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck"]

  # ---------------------------------------------------------------------------
  # ENGINE — idle by design. The pipeline (scanner/security/intelligence/
  # committee/strategy/risk/execution) runs in the WORKER service; this is a
  # reserved slot for splitting the decision loop out later. See docs/OPERATING.md.
  # ---------------------------------------------------------------------------
  engine:
    <<: *app-base
    command: ["hades-engine"]
    # Overrides app-base depends_on, so the migrate gate must be repeated here.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck", "--role", "engine"]

  # ---------------------------------------------------------------------------
  # WORKER — general background loops / event consumers
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-base
    command: ["hades-worker"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck", "--role", "worker"]

  # ---------------------------------------------------------------------------
  # SCHEDULER — periodic jobs (backups, cleanup)
  # ---------------------------------------------------------------------------
  scheduler:
    <<: *app-base
    command: ["hades-scheduler"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck", "--role", "scheduler"]

  # ---------------------------------------------------------------------------
  # NOTIFICATION — the only Discord delivery service (event-driven)
  # ---------------------------------------------------------------------------
  notification:
    <<: *app-base
    command: ["hades-notification"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck", "--role", "notification"]

  # ---------------------------------------------------------------------------
  # WATCHDOG — independent monitor (spans all tiers to observe them)
  # ---------------------------------------------------------------------------
  watchdog:
    <<: *app-base
    command: ["hades-watchdog"]
    networks:
      - frontend
      - backend
      - database
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-m", "hades.ops.healthcheck", "--role", "watchdog"]

  # ---------------------------------------------------------------------------
  # DASHBOARD (React + Vite + Tailwind — frontend tier only)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    networks:
      - frontend
    ports:
      # Same posture as the API: the dashboard drives it, so exposing one
      # without the other buys nothing. See API_BIND above.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-5173}:5173"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]

  # ---------------------------------------------------------------------------
  # OBSERVABILITY (optional — profile: observability)
  # ---------------------------------------------------------------------------
  prometheus:
    # Pinned (never `:latest`) for reproducible builds; v2.53 is the current LTS.
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
    # Admin UI bound to localhost only — reach it via an SSH tunnel, never exposed
    # on a public interface.
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend
    # Admin UI bound to localhost only (see prometheus).
    ports:
      - "127.0.0.1:3001:3000"

# --- networks (three-tier separation) ----------------------------------------
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  database:
    driver: bridge

# --- volumes (everything durable survives restarts) --------------------------
volumes:
  postgres_data:      # database
  redis_data:         # cache/queues (ephemeral data, persisted AOF for restarts)
  clickhouse_data:    # analytics
  grafana_data:       # dashboards
  hades_logs:         # structured logs (per-domain + combined)
  hades_run:          # liveness heartbeat files (shared with the watchdog)
  hades_config:       # runtime configuration overrides
  hades_models:       # AI/ML model registry
  hades_backups:      # automatic backups
  hades_datasets:     # datasets / feature store
  hades_research:     # research lab artifacts
  hades_docs:         # documentation
